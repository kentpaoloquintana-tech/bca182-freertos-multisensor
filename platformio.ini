[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
lib_archive = no
monitor_speed = 115200
monitor_port = socket://localhost:4000
build_flags =
    -Iinclude
    -I.pio/libdeps/bluepill_f103c8/FreeRTOS-Kernel/include
    -I.pio/libdeps/bluepill_f103c8/FreeRTOS-Kernel/portable/GCC/ARM_CM3
lib_deps =
    https://github.com/FreeRTOS/FreeRTOS-Kernel.git#V10.5.1

[env:native]
platform = native
test_framework = unity
test_filter = test_logic
test_build_src = yes
build_flags =
    -Iinclude
    -std=c++11
build_src_filter =
    +<app_logic.cpp>
lib_deps =
    throwtheswitch/Unity@^2.6.1